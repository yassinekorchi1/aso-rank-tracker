name: Daily ASO Tracker

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Scraper
        run: npm install

      - name: Run Tracker Script
        run: node tracker.js

      - name: Save Results Back To Repo
        run: |
          git config --global user.name 'ASO Bot'
          git config --global user.email 'bot@github.com'
          git add rank_history.csv
          git commit -m "Auto-update ranks [skip ci]" || exit 0
          git push
